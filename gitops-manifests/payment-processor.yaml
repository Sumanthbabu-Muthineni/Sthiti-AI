apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-processor
  namespace: watchdog-demo
  labels:
    app: payment-processor
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment-processor
  template:
    metadata:
      labels:
        app: payment-processor
    spec:
      containers:
      - name: payment-processor
        image: nginx:alpine
        resources:
          limits:
            memory: "256Mi"
            cpu: "200m"
          requests:
            memory: "128Mi"
            cpu: "100m"
        ports:
        - containerPort: 80

