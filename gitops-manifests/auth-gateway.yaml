apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-gateway
  namespace: watchdog-demo
  labels:
    app: auth-gateway
    tier: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-gateway
  template:
    metadata:
      labels:
        app: auth-gateway
    spec:
      containers:
      - name: auth-gateway
        image: nginx:alpine
        resources:
          limits:
            memory: "512Mi"
            cpu: "250m"
        ports:
        - containerPort: 80
