apiVersion: v1
kind: ConfigMap
metadata:
  name: watchdog-frontend-nginx-config
  namespace: watchdog-system
  labels:
    app.kubernetes.io/name: watchdog-frontend
data:
  nginx.conf: |
    server {
        listen 80;
        server_name localhost;

        # Gzip compression for static assets
        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

        # Static React SPA
        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        # Backend REST API Proxy
        location /api/v1/ {
            proxy_pass http://watchdog-backend:8000/api/v1/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Real-time SSE Stream Proxy with No Buffering
        location /api/v1/stream {
            proxy_pass http://watchdog-backend:8000/api/v1/stream;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_set_header Host $host;
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: watchdog-frontend
  namespace: watchdog-system
  labels:
    app.kubernetes.io/name: watchdog-frontend
    app.kubernetes.io/component: ui-dashboard
    app.kubernetes.io/part-of: watchdog-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: watchdog-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: watchdog-frontend
    spec:
      containers:
        - name: watchdog-frontend
          image: ghcr.io/k8s-agentic-watchdog/frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: nginx-config
          configMap:
            name: watchdog-frontend-nginx-config
