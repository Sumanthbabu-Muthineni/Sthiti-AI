apiVersion: v1
kind: Secret
metadata:
  name: watchdog-secrets
  namespace: watchdog-system
  labels:
    app.kubernetes.io/name: k8s-agentic-watchdog
type: Opaque
stringData:
  # Base64 encoded or raw stringData for OpenAI API Key
  OPENAI_API_KEY: "sk-proj-your-openai-api-key-here"

  # Optional GitHub Token for GitOps PR Creation
  GITHUB_TOKEN: "ghp_your_github_personal_access_token"
  GITHUB_REPO: "infrastructure/k8s-manifests"
